<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#820c59">
    <title>OTS Mobile Scanner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        :root {
            --primary: #820c59;
            --primary-dark: #5a083d;
            --background: #f0f4f8;
            --text: #0f172a;
            --muted: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 16px;
            background: var(--background);
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(100%, 520px);
            margin: 0 auto;
        }

        header {
            margin: -16px -16px 20px;
            padding: 20px 16px;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        header h1 {
            margin: 0;
            font-size: 1.25rem;
        }

        header p {
            margin: 6px 0 0;
            font-size: 0.875rem;
            opacity: 0.9;
        }

        .card {
            padding: 16px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.06);
        }

        #qr-reader {
            width: 100%;
            min-height: 240px;
            overflow: hidden;
            border-radius: 12px;
            background: #090d16;
        }

        #qr-reader video {
            border-radius: 12px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        button {
            flex: 1;
            min-height: 46px;
            padding: 10px 14px;
            border: 0;
            border-radius: 10px;
            color: white;
            background: var(--primary);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button.secondary { background: #475569; }
        button:disabled { opacity: 0.55; cursor: not-allowed; }

        #status {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
            overflow-wrap: anywhere;
        }

        #result {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            background: #f1f5f9;
            overflow-wrap: anywhere;
        }

        #result.visible { display: block; }

        .hint {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 0.8rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <header>
        <h1>OTS Mobile Scanner</h1>
        <p>Scan a QR code or supported barcode</p>
    </header>

    <main>
        <section class="card">
            <div id="qr-reader"></div>

            <div class="buttons">
                <button id="startButton" type="button">Start scanner</button>
                <button id="stopButton" class="secondary" type="button" disabled>Stop</button>
            </div>

            <p id="status" role="status">Tap “Start scanner” and allow camera access.</p>
            <div id="result" aria-live="polite"></div>

            <p class="hint">
                Camera scanning requires HTTPS (or localhost for testing).
                If asked, allow this site to use your camera.
            </p>
        </section>
    </main>

    <script>
        const statusElement = document.getElementById("status");
        const resultElement = document.getElementById("result");
        const startButton = document.getElementById("startButton");
        const stopButton = document.getElementById("stopButton");

        let scanner = null;
        let isStarting = false;

        function showStatus(message) {
            statusElement.textContent = message;
        }

        async function startScanner() {
            if (isStarting || (scanner && scanner.isScanning)) return;

            if (!window.Html5Qrcode) {
                showStatus("Scanner library did not load. Check your internet connection and reload.");
                return;
            }

            isStarting = true;
            startButton.disabled = true;
            resultElement.classList.remove("visible");
            resultElement.textContent = "";

            try {
                if (!scanner) {
                    scanner = new Html5Qrcode("qr-reader");
                }

                showStatus("Requesting camera access…");

                const cameras = await Html5Qrcode.getCameras();

                if (!cameras || cameras.length === 0) {
                    showStatus("No camera was found on this device.");
                    return;
                }

                const rearCamera = cameras.find(camera =>
                    /back|rear|environment/i.test(camera.label)
                );
                const selectedCamera = rearCamera || cameras[cameras.length - 1];

                const formats = [
                    Html5QrcodeSupportedFormats.QR_CODE,
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.CODE_39,
                    Html5QrcodeSupportedFormats.CODE_93,
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.ITF,
                    Html5QrcodeSupportedFormats.CODABAR
                ];

                await scanner.start(
                    selectedCamera.id,
                    {
                        fps: 10,
                        aspectRatio: 1.5,
                        formatsToSupport: formats,
                        qrbox: (viewWidth, viewHeight) => {
                            const width = Math.min(viewWidth * 0.85, 320);
                            const height = Math.min(viewHeight * 0.5, 180);
                            return { width, height };
                        }
                    },
                    decodedText => {
                        resultElement.textContent = "Scanned result: " + decodedText;
                        resultElement.classList.add("visible");
                        showStatus("Scan successful.");
                        stopScanner();
                    },
                    () => {
                        // No code detected in this video frame.
                    }
                );

                stopButton.disabled = false;
                showStatus("Camera is active. Point it at a QR code or barcode.");
            } catch (error) {
                console.error("Scanner error:", error);
                showStatus(
                    "Could not start the camera. Check HTTPS, camera permissions, and that no other app is using it."
                );
            } finally {
                isStarting = false;
                startButton.disabled = false;
            }
        }

        async function stopScanner() {
            if (!scanner || !scanner.isScanning) {
                stopButton.disabled = true;
                return;
            }

            stopButton.disabled = true;

            try {
                await scanner.stop();
                showStatus("Scanner stopped.");
            } catch (error) {
                console.error("Error stopping scanner:", error);
                showStatus("The scanner could not be stopped cleanly. Reload the page if needed.");
            }
        }

        startButton.addEventListener("click", startScanner);
        stopButton.addEventListener("click", stopScanner);
    </script>
</body>
</html>
